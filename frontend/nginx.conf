server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Redirect .html URLs to clean URLs
    location = /index.html        { return 301 /; }
    location = /stock.html        { return 301 /stock; }
    location = /investment_calc.html { return 301 /investment_calc; }
    location = /items.html        { return 301 /item; }

    location = / {
        try_files /index.html =404;
    }

    location = /stock {
        try_files /stock.html =404;
    }

    location = /investment_calc {
        try_files /investment_calc.html =404;
    }

    location = /item {
        try_files /items.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}