<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1" name="viewport"/>
  <title>Увійти</title>
  <link href="style/index.css" rel="stylesheet"/>
  <style> .auth-form {
      max-width: 420px;
      margin: 40px auto
  }

  .field {
      margin-bottom: 12px
  }</style>
</head>
<body>
<div class="container auth-form">
  <h1>Увійти</h1>
  <div class="field">
    <label for="email">Email</label>
    <input id="email" type="email"/>
  </div>
  <div class="field">
    <label for="password">Пароль</label>
    <input id="password" type="password"/>
  </div>
  <div class="actions">
    <button class="btn" id="btnLogin">Увійти</button>
    <a class="btn secondary" href="/register">Реєстрація</a>
  </div>
  <div id="msg" style="margin-top:12px;color:#b91c1c"></div>
</div>
<script src="script/auth.js"></script>
<script>
    document.getElementById('btnLogin').addEventListener('click', async () => {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        if (!email || !password) return document.getElementById('msg').textContent = 'Введіть email та пароль';
        const res = await authUI.loginUI(email, password);
        if (!res.ok) return document.getElementById('msg').textContent = 'Невірні облікові дані';
        // redirect
        window.location.href = '/';
    });
</script>
</body>
</html>
